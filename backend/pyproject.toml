[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "openai>=3.13.0",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.7.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.9",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
